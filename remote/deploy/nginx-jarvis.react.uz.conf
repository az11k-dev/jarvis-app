# JARVIS relay. Certificate from certbot (webroot /var/www/html).
server {
    listen 80;
    listen [::]:80;
    server_name jarvis.react.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jarvis.react.uz;

    ssl_certificate     /etc/letsencrypt/live/jarvis.react.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis.react.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/jarvis.access.log;
    error_log  /var/log/nginx/jarvis.error.log;

    client_max_body_size 16m;   # screenshots from the laptop

    location /v1/ {
        proxy_pass         http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;              # long polls answer when a job arrives
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        return 404;
    }
}
